aid: lookout
name: Lookout
description: Lookout is an endpoint-to-cloud cybersecurity company focused on mobile
  threat defense and data protection. Its Mobile Endpoint Security (MES) platform detects
  and responds to mobile-specific threats — phishing, smishing, malicious apps, network
  attacks, and device compromise — across enterprise and government fleets. Lookout
  exposes RESTful Mobile Intelligence APIs (the Mobile Risk API v2, SSO Config API,
  Connector API, and PCP Threat Feed) that stream threat events, device state, and
  vulnerability data into SIEM, SOAR, XDR, and MDM/EMM tooling using OAuth 2.0 client
  credentials authentication.
