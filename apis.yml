apis:
- name: Lookout Mobile Risk API v2
  description: RESTful HTTP interface for streaming and querying mobile threat, device,
    OS, application, and vulnerability data from a Lookout Mobile Endpoint Security
    tenant. Uses OAuth 2.0 client-credentials authentication with an application key
    generated in the MES Console. All endpoints are rate limited to 100 requests per
    minute.
